name: Pages

# One Pages site, three parts:
#   /        clickable prototype (docs/ on main)
#   /app/    stable web app (web/ on main)
#   /beta/   beta web app (web/ on the beta branch, separate on-device data)
# Keep this file identical on main and beta.
#
# Deploys always run from main (the github-pages environment only accepts main). A push to beta
# runs CI on beta; when that CI passes, this workflow (from main) rebuilds both apps and deploys.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build prototype + stable + beta
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable

      - name: Check out beta
        id: beta
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stable app (/app/)
        working-directory: stable/web
        env:
          BASE: /app/
        run: npm ci && npm test && npm run build

      - name: Build beta app (/beta/)
        if: steps.beta.outcome == 'success' && hashFiles('beta/web/package.json') != ''
        working-directory: beta/web
        env:
          BASE: /beta/
        run: npm ci && npm test && npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r stable/docs/. _site/
          cp -r stable/web/dist/. _site/app/
          if [ -d beta/web/dist ]; then mkdir -p _site/beta && cp -r beta/web/dist/. _site/beta/; fi
          touch _site/.nojekyll
          ls _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
